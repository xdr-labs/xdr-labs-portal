version: 1
setup_command: ''
paths:
  '**':
    domains:
    - core
scenarios:
- id: ADOPTED-TEST-001
  cost: medium
  estimated_seconds: 180
  timeout_seconds: 600
  agent_default: true
  scope: integration
  name: Project-native affected tests
  level: integration
  domains:
  - core
  triggers:
  - affected
  platforms:
  - linux
  command: python3 -m json.tool docs.json
  invariants:
  - project-native tests remain green for affected changes
  release_gate: true
- id: ADOPTED-STATIC-001
  cost: cheap
  estimated_seconds: 2
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Git whitespace validation
  level: static
  domains:
  - core
  triggers:
  - pr
  - preflight
  - release
  platforms:
  - linux
  command: bash -lc 'if [ -n "${ENGINEERING_BASE_REF:-}" ]; then git diff --check
    "${ENGINEERING_BASE_REF}...HEAD"; elif git rev-parse --verify --quiet origin/main
    >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify
    --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse
    --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git
    diff --check; fi'
  invariants:
  - committed candidate/base diff has no whitespace errors
  release_gate: true
- id: JAVA4SHELL-PACKAGE-001
  cost: cheap
  estimated_seconds: 2
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Java4Shell 333+6 candidate integrity
  level: static
  domains:
  - core
  triggers:
  - affected
  - pr
  - preflight
  - release
  platforms:
  - linux
  command: python3 validation/java4shell-20261118/verify_package.py
  invariants:
  - Published 333 rules remain byte-identical and combined 339 rule SIDs stay unique
  release_gate: true

- id: AGENTIC-SURICATA-STATIC-001
  cost: cheap
  estimated_seconds: 3
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Agentic 383 unified RC baseline and SID validation
  level: static
  domains:
  - core
  triggers:
  - affected
  - pr
  platforms:
  - linux
  command: python3 validation/agentic-20261121/run_offline.py --static-only
  invariants:
  - Original 339 bytes retained and all 44 new SID signatures merged in one file
  release_gate: true

- id: AGENTIC-SITE-STATIC-001
  cost: cheap
  estimated_seconds: 3
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Agentic 383 catalog and bilingual public page verification
  level: static
  domains:
  - core
  triggers:
  - affected
  - pr
  - release
  platforms:
  - linux
  command: python3 validation/agentic-20261121/verify_publication.py
  invariants:
  - Both pages and the full 383-rule catalog match the immutable source
  release_gate: true

- id: SURICATA-383-INVENTORY-001
  cost: cheap
  estimated_seconds: 4
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Audit 383 per-SID evidence rows without historical/new conflation
  level: static
  domains:
  - core
  triggers:
  - affected
  - pr
  platforms:
  - linux
  command: python3 validation/suricata-audit-20261122/audit_inventory.py
  invariants:
  - 383 unique SIDs and historical verification provenance remain explicit
  - Risk flags and overlapping OAST rules are disclosed
  release_gate: true

- id: SURICATA-383-SENSOR-EVIDENCE-001
  cost: cheap
  estimated_seconds: 3
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Actual Modular Sensor 381-of-383 SID offline evidence integrity
  level: static
  domains:
  - core
  triggers:
  - affected
  - pr
  platforms:
  - linux
  command: python3 validation/suricata-audit-20261122/verify_sensor_evidence.py
  invariants:
